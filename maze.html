<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .maze-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 10px;
        }
        svg {
            max-width: 98vw;
            max-height: 98vh;
        }
        .maze-line {
            stroke: #fff;
            stroke-width: 7;
            stroke-linecap: square;
            stroke-linejoin: miter;
            fill: none;
            filter: drop-shadow(0 0 0.5px rgba(255,255,255,0.4));
        }
        .arrow {
            stroke: #fff;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>

                        <feMergeNode in="SourceGraphic"/>
