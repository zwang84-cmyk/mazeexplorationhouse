<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Exploration Demo - Layer Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #info {
            margin-bottom: 20px;
            text-align: center;
        }

        #info h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #info p {
            font-size: 14px;
            color: #aaa;
        }

        #layer-indicator {
            font-size: 18px;
            color: #ffd700;
            margin-top: 10px;
        }

        #canvas-container {
            position: relative;
        }

        #gameCanvas {
            border: 2px solid #333;
            display: block;
        }

        #controls {
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>Maze Exploration Demo</h1>
        <p>Use <strong>W A S D</strong> to move | Press <strong>N</strong> to switch layers</p>
        <div id="layer-indicator">Layer 1 - Bordered Maze</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="960" height="544"></canvas>
    </div>

    <div id="controls">
        <p>Dead ends will flash red when triggered | Reach the exit</p>
    </div>

    <script>
        // =====================================================
        // MAZE GAME DEMO - Layer 1 & Layer 2 Preview
        // =====================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const layerIndicator = document.getElementById('layer-indicator');

        // Configuration - Layer 1 is rectangular (16:9 ratio)
        const CELL_SIZE = 32;
        const GRID_WIDTH_L1 = 30;
        const GRID_HEIGHT_L1 = 17;
        const GRID_SIZE_L2 = 17;
        const PLAYER_RADIUS = 6;

        // Game state
        let currentLayer = 1;
        let playerX = 1;
        let playerY = 15;
        let flashTimer = 0;
        let isFlashing = false;
        const FLASH_DURATION = 12;

        // Key states
        const keys = { w: false, a: false, s: false, d: false };

        // Movement cooldown
        let moveCooldown = 0;
        const MOVE_DELAY = 8;

        // =====================================================
        // LAYER 1 MAZE - Rectangular, Single-Solution
        // Start: (1,15) bottom-left | Exit: (26,1) upper-right
        // =====================================================

        function createMaze1() {
            const maze = [];
            for (let y = 0; y < GRID_HEIGHT_L1; y++) {
                maze[y] = [];
                for (let x = 0; x < GRID_WIDTH_L1; x++) {
                    maze[y][x] = 1;
                }
            }

            // MAIN SOLUTION PATH (single continuous path, no loops)
            // Traced carefully: Start(1,15) -> Exit(26,1)
            const mainPath = [
                // Segment 1: Start, go up
                [1,15], [1,14], [1,13], [1,12], [1,11],
                // Segment 2: Go right
                [2,11], [3,11], [4,11], [5,11],
                // Segment 3: Go down
                [5,12], [5,13], [5,14],
                // Segment 4: Go right
                [6,14], [7,14], [8,14], [9,14],
                // Segment 5: Go up
                [9,13], [9,12], [9,11], [9,10],
                // Segment 6: Go right
                [10,10], [11,10], [12,10], [13,10],
                // Segment 7: Go down then right
                [13,11], [13,12], [13,13],
                [14,13], [15,13], [16,13], [17,13],
                // Segment 8: Go up
                [17,12], [17,11], [17,10], [17,9], [17,8], [17,7],
                // Segment 9: Go right
                [18,7], [19,7], [20,7], [21,7],
                // Segment 10: Go up
                [21,6], [21,5], [21,4],
                // Segment 11: Go right then up to exit
                [22,4], [23,4], [24,4], [25,4],
                [25,3], [25,2], [25,1], [26,1]
            ];

            // DEAD END 1: From (1,11) continue up - top-left corner trap
            const de1 = [
                [1,10], [1,9], [1,8], [1,7], [1,6], [1,5], [1,4], [1,3], [1,2], [1,1],
                [2,1], [3,1], [4,1], [5,1], [6,1], [7,1],
                [7,2], [7,3], [7,4], [7,5]
            ];

            // DEAD END 2: From (5,11) branch up - left-side alternate
            const de2 = [
                [5,10], [5,9], [5,8], [5,7],
                [4,7], [3,7], [2,7],
                [2,6], [2,5], [2,4], [2,3]
            ];

            // DEAD END 3: From (9,14) continue right - bottom path
            const de3 = [
                [10,14], [11,14], [12,14], [13,14], [14,14], [15,14], [16,14],
                [16,15],
                [15,15], [14,15], [13,15]
            ];

            // DEAD END 4: From (9,10) go up - middle shortcut illusion
            const de4 = [
                [9,9], [9,8], [9,7], [9,6], [9,5], [9,4], [9,3],
                [10,3], [11,3], [12,3], [13,3],
                [13,4], [13,5], [13,6], [13,7]
            ];

            // DEAD END 5: From (13,10) go up - mid-right path
            const de5 = [
                [13,9], [13,8],
                [14,8], [15,8], [16,8],
                [16,9], [16,10],
                [15,10], [14,10]
            ];

            // DEAD END 6: From (17,13) go right - bottom-right area
            const de6 = [
                [18,13], [19,13], [20,13], [21,13],
                [21,14], [21,15],
                [22,15], [23,15], [24,15], [25,15],
                [25,14], [25,13], [25,12], [25,11]
            ];

            // DEAD END 7: From (17,7) go up - false direct route to top
            const de7 = [
                [17,6], [17,5], [17,4], [17,3], [17,2], [17,1],
                [18,1], [19,1], [20,1], [21,1], [22,1], [23,1]
            ];

            // DEAD END 8: From (21,7) go right - near-exit trap
            const de8 = [
                [22,7], [23,7], [24,7], [25,7], [26,7], [27,7],
                [27,8], [27,9], [27,10], [27,11],
                [28,11], [28,10], [28,9], [28,8], [28,7]
            ];

            // DEAD END 9: Past exit area
            const de9 = [
                [27,1], [28,1],
                [28,2], [28,3], [28,4], [28,5]
            ];

            // DEAD END 10: From (21,4) branch down-right
            const de10 = [
                [21,8], [21,9], [21,10], [21,11],
                [22,11], [23,11], [24,11]
            ];

            // Carve all paths
            const allPaths = [...mainPath, ...de1, ...de2, ...de3, ...de4, ...de5, ...de6, ...de7, ...de8, ...de9, ...de10];

            for (const [x, y] of allPaths) {
                if (x >= 0 && x < GRID_WIDTH_L1 && y >= 0 && y < GRID_HEIGHT_L1) {
                    maze[y][x] = 0;
                }
            }

            // Dead-end trigger zones (terminus of each dead end)
            maze[5][7] = 2;   // DE1 terminus
            maze[3][2] = 2;   // DE2 terminus
            maze[15][13] = 2; // DE3 terminus
            maze[7][13] = 2;  // DE4 terminus
            maze[10][14] = 2; // DE5 terminus
            maze[11][25] = 2; // DE6 terminus
            maze[1][23] = 2;  // DE7 terminus
            maze[7][28] = 2;  // DE8 terminus
            maze[5][28] = 2;  // DE9 terminus
            maze[11][24] = 2; // DE10 terminus

            return maze;
        }

        // =====================================================
        // LAYER 2 MAZE - Square with gradient mask
        // =====================================================

        function createMaze2() {
            const size = GRID_SIZE_L2;
            const maze = [];
            for (let y = 0; y < size; y++) {
                maze[y] = [];
                for (let x = 0; x < size; x++) {
                    maze[y][x] = 1;
                }
            }

            // Main path from (1,1) to (15,15)
            const mainPath = [
                [1,1], [2,1], [3,1], [4,1], [5,1],
                [5,2], [5,3], [5,4], [5,5],
                [6,5], [7,5], [8,5], [9,5],
                [9,6], [9,7], [9,8], [9,9],
                [10,9], [11,9], [12,9], [13,9],
                [13,10], [13,11], [13,12], [13,13],
                [14,13], [15,13],
                [15,14], [15,15]
            ];

            // Dead ends
            const deadEnds = [
                [1,2], [1,3], [1,4], [1,5],
                [2,5], [3,5], [4,5],
                [9,4], [9,3], [9,2], [9,1],
                [10,1], [11,1], [12,1], [13,1],
                [13,2], [13,3], [13,4], [13,5],
                [14,5], [15,5],
                [15,6], [15,7], [15,8], [15,9],
                [5,6], [5,7], [5,8], [5,9],
                [4,9], [3,9], [2,9], [1,9],
                [1,10], [1,11], [1,12], [1,13],
                [2,13], [3,13], [4,13], [5,13],
                [5,14], [5,15],
                [6,15], [7,15], [8,15], [9,15],
                [9,14], [9,13], [9,12], [9,11]
            ];

            const allPaths = [...mainPath, ...deadEnds];
            for (const [x, y] of allPaths) {
                if (x >= 0 && x < size && y >= 0 && y < size) {
                    maze[y][x] = 0;
                }
            }

            maze[5][1] = 2;
            maze[13][1] = 2;
            maze[15][5] = 2;
            maze[9][15] = 2;
            maze[11][9] = 2;

            return maze;
        }

        const maze1 = createMaze1();
        const maze2 = createMaze2();

        function getCurrentMaze() {
            return currentLayer === 1 ? maze1 : maze2;
        }

        function getGridWidth() {
            return currentLayer === 1 ? GRID_WIDTH_L1 : GRID_SIZE_L2;
        }

        function getGridHeight() {
            return currentLayer === 1 ? GRID_HEIGHT_L1 : GRID_SIZE_L2;
        }

        // =====================================================
        // INPUT HANDLING
        // =====================================================

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (key === 'n') switchLayer();
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
        });

        function switchLayer() {
            currentLayer = currentLayer === 1 ? 2 : 1;
            isFlashing = false;
            flashTimer = 0;

            if (currentLayer === 1) {
                playerX = 1;
                playerY = 15;
                layerIndicator.textContent = 'Layer 1 - Bordered Maze';
            } else {
                playerX = 1;
                playerY = 1;
                layerIndicator.textContent = 'Layer 2 - Endless Maze (Gradient Mask)';
            }
        }

        // =====================================================
        // GAME LOGIC
        // =====================================================

        function canMoveTo(x, y) {
            const maze = getCurrentMaze();
            const w = getGridWidth();
            const h = getGridHeight();
            if (x < 0 || x >= w || y < 0 || y >= h) return false;
            return maze[y][x] !== 1;
        }

        function checkDeadEndTrigger(x, y) {
            const maze = getCurrentMaze();
            if (maze[y] && maze[y][x] === 2 && !isFlashing) {
                isFlashing = true;
                flashTimer = FLASH_DURATION;
            }
        }

        function update() {
            if (moveCooldown > 0) {
                moveCooldown--;
            } else {
                let newX = playerX;
                let newY = playerY;
                let moved = false;

                if (keys.w) { newY--; moved = true; }
                else if (keys.s) { newY++; moved = true; }
                else if (keys.a) { newX--; moved = true; }
                else if (keys.d) { newX++; moved = true; }

                if (moved && canMoveTo(newX, newY)) {
                    playerX = newX;
                    playerY = newY;
                    moveCooldown = MOVE_DELAY;
                    checkDeadEndTrigger(playerX, playerY);
                }
            }

            if (isFlashing) {
                flashTimer--;
                if (flashTimer <= 0) isFlashing = false;
            }
        }

        // =====================================================
        // RENDERING
        // =====================================================

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const maze = getCurrentMaze();
            const gridW = getGridWidth();
            const gridH = getGridHeight();
            const wallColor = isFlashing ? '#ff3333' : '#ffffff';

            const mazePixelW = gridW * CELL_SIZE;
            const mazePixelH = gridH * CELL_SIZE;
            const offsetX = Math.floor((canvas.width - mazePixelW) / 2);
            const offsetY = Math.floor((canvas.height - mazePixelH) / 2);

            // Draw maze walls
            for (let y = 0; y < gridH; y++) {
                for (let x = 0; x < gridW; x++) {
                    const px = offsetX + x * CELL_SIZE;
                    const py = offsetY + y * CELL_SIZE;

                    if (maze[y][x] === 1) {
                        ctx.fillStyle = wallColor;
                        ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    }
                    if (maze[y][x] === 2) {
                        ctx.fillStyle = isFlashing ? 'rgba(255, 100, 100, 0.3)' : 'rgba(255, 255, 255, 0.1)';
                        ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            // Exit and start positions
            let exitX, exitY, startX, startY;
            if (currentLayer === 1) {
                startX = 1; startY = 15;
                exitX = 26; exitY = 1;
            } else {
                startX = 1; startY = 1;
                exitX = 15; exitY = 15;
            }

            // Draw exit marker (pulsing green)
            ctx.fillStyle = '#00ff00';
            ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() / 200);
            ctx.fillRect(
                offsetX + exitX * CELL_SIZE + 5,
                offsetY + exitY * CELL_SIZE + 5,
                CELL_SIZE - 10, CELL_SIZE - 10
            );
            ctx.globalAlpha = 1;

            // Draw start marker (cyan)
            ctx.fillStyle = '#00ffff';
            ctx.globalAlpha = 0.3;
            ctx.fillRect(
                offsetX + startX * CELL_SIZE + 5,
                offsetY + startY * CELL_SIZE + 5,
                CELL_SIZE - 10, CELL_SIZE - 10
            );
            ctx.globalAlpha = 1;

            // Layer 2: Radial gradient mask for endless effect
            if (currentLayer === 2) {
                const centerX = offsetX + (gridW * CELL_SIZE) / 2;
                const centerY = offsetY + (gridH * CELL_SIZE) / 2;
                const gradient = ctx.createRadialGradient(
                    centerX, centerY, 100,
                    centerX, centerY, 350
                );
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.3)');
                gradient.addColorStop(0.8, 'rgba(0, 0, 0, 0.7)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Layer 1: Draw border
            if (currentLayer === 1) {
                ctx.strokeStyle = wallColor;
                ctx.lineWidth = 4;
                ctx.strokeRect(offsetX, offsetY, mazePixelW, mazePixelH);
            }

            // Draw player
            const playerScreenX = offsetX + playerX * CELL_SIZE + CELL_SIZE / 2;
            const playerScreenY = offsetY + playerY * CELL_SIZE + CELL_SIZE / 2;

            ctx.beginPath();
            ctx.arc(playerScreenX, playerScreenY, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Player glow
            ctx.beginPath();
            ctx.arc(playerScreenX, playerScreenY, PLAYER_RADIUS + 3, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Position indicator
            ctx.fillStyle = '#666';
            ctx.font = '12px monospace';
            ctx.fillText(`Position: (${playerX}, ${playerY})`, 10, canvas.height - 10);
        }

        // =====================================================
        // GAME LOOP
        // =====================================================

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
