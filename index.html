<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Exploration - Flashlight Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body.game-active {
            cursor: none;
        }

        #maze-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #maze-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        #flashlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: #000;
            mask-image: radial-gradient(circle 120px at var(--mouse-x, -200px) var(--mouse-y, -200px),
                transparent 0%,
                transparent 60%,
                rgba(0, 0, 0, 0.3) 80%,
                rgba(0, 0, 0, 0.7) 90%,
                black 100%);
            -webkit-mask-image: radial-gradient(circle 120px at var(--mouse-x, -200px) var(--mouse-y, -200px),
                transparent 0%,
                transparent 60%,
                rgba(0, 0, 0, 0.3) 80%,
                rgba(0, 0, 0, 0.7) 90%,
                black 100%);
        }

        #custom-cursor {
            position: fixed;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1000;
            display: block;
        }

        #player {
            position: fixed;
            height: 36px;
            width: auto;
            pointer-events: none;
            z-index: 50;
            transform: translate(-50%, -50%);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            cursor: pointer;
        }

        #start-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #start-screen.hidden {
            display: none;
        }

        .game-hidden {
            visibility: hidden;
        }
    </style>
</head>

    <div id="flashlight-overlay" class="game-hidden"></div>

    <script>
        const overlay = document.getElementById('flashlight-overlay');
        const cursor = document.getElementById('custom-cursor');
        const player = document.getElementById('player');
        const mazeImage = document.getElementById('maze-image');
        const startScreen = document.getElementById('start-screen');
        const mazeContainer = document.getElementById('maze-container');

        // Start screen click handler
        startScreen.addEventListener('click', function() {
            // Hide start screen
            startScreen.classList.add('hidden');

            // Show game elements
            document.body.classList.add('game-active');
            mazeContainer.classList.remove('game-hidden');
            player.classList.remove('game-hidden');
            overlay.classList.remove('game-hidden');
            cursor.classList.remove('game-hidden');
        });

        let mouseX = -200;
        let mouseY = -200;
        let targetX = -200;
        let targetY = -200;

        // Player position (start at center of screen)
        let playerX = window.innerWidth / 2;
        let playerY = window.innerHeight / 2;
        let playerVelX = 0;
        let playerVelY = 0;

        // Movement settings
        const moveSpeed = 1;
        const friction = 0.85;

        // Collision detection setup
        let collisionCanvas = null;
        let collisionCtx = null;
        let mazeRect = null;
        let mazeScale = 1;

        // Initialize collision detection
        function initCollision() {
            collisionCanvas = document.createElement('canvas');
            collisionCtx = collisionCanvas.getContext('2d', { willReadFrequently: true });

            // Set canvas size to match maze image natural size
            collisionCanvas.width = mazeImage.naturalWidth;
            collisionCanvas.height = mazeImage.naturalHeight;

            // Draw maze to canvas
            collisionCtx.drawImage(mazeImage, 0, 0);

            updateMazeRect();
        }

        // Update maze position info
        function updateMazeRect() {
            mazeRect = mazeImage.getBoundingClientRect();
            mazeScale = mazeImage.naturalWidth / mazeRect.width;
        }

        // Check if a screen position is on a wall (white pixel)
        function isWall(screenX, screenY) {
            if (!collisionCtx || !mazeRect) return false;

            // Convert screen position to maze image coordinates
            const mazeX = Math.floor((screenX - mazeRect.left) * mazeScale);
            const mazeY = Math.floor((screenY - mazeRect.top) * mazeScale);

            // Check if position is outside maze bounds
            if (mazeX < 0 || mazeX >= collisionCanvas.width ||
                mazeY < 0 || mazeY >= collisionCanvas.height) {
                return true; // Treat outside as wall
            }

            // Get pixel color at position
            const pixel = collisionCtx.getImageData(mazeX, mazeY, 1, 1).data;

            // Check if pixel is white (wall) - threshold for white
            const brightness = (pixel[0] + pixel[1] + pixel[2]) / 3;
            return brightness > 200;
        }

        // Check collision for player at given position
        function checkCollision(x, y) {
            // Check multiple points around the player for better collision
            const checkRadius = 8;
            const points = [
                { x: x, y: y },                          // Center
                { x: x - checkRadius, y: y },            // Left
                { x: x + checkRadius, y: y },            // Right
                { x: x, y: y - checkRadius },            // Top
                { x: x, y: y + checkRadius },            // Bottom
            ];

            for (const point of points) {
                if (isWall(point.x, point.y)) {
                    return true;
                }
            }
            return false;
        }

        // Initialize when maze image loads
        mazeImage.onload = function() {
            initCollision();
        };

        // If image already loaded
        if (mazeImage.complete) {
            initCollision();
        }

        // Update maze rect on resize
        window.addEventListener('resize', updateMazeRect);

        // Track pressed keys
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false
        };

        // Smoothing factor
        const smoothing = 0.15;

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        document.addEventListener('mouseleave', () => {
            targetX = -200;
            targetY = -200;
        });

        document.addEventListener('mouseenter', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
            mouseX = targetX;
            mouseY = targetY;
        });

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) {
                keys[key] = true;
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // Animation loop
        function animate() {
            mouseX += (targetX - mouseX) * smoothing;
            mouseY += (targetY - mouseY) * smoothing;

            overlay.style.setProperty('--mouse-x', `${mouseX}px`);
            overlay.style.setProperty('--mouse-y', `${mouseY}px`);

            cursor.style.left = `${mouseX}px`;
            cursor.style.top = `${mouseY}px`;

            if (keys.w) playerVelY -= moveSpeed;
            if (keys.s) playerVelY += moveSpeed;
            if (keys.a) playerVelX -= moveSpeed;
            if (keys.d) playerVelX += moveSpeed;

            playerVelX *= friction;
            playerVelY *= friction;

            // Calculate new position
            let newX = playerX + playerVelX;
            let newY = playerY + playerVelY;

            // Check collision for X movement
            if (!checkCollision(newX, playerY)) {
                playerX = newX;
            } else {
                playerVelX = 0;
            }

            // Check collision for Y movement
            if (!checkCollision(playerX, newY)) {
                playerY = newY;
            } else {
                playerVelY = 0;
            }

            player.style.left = `${playerX}px`;
            player.style.top = `${playerY}px`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
