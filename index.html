<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth of Shadows</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="ornate-frame">
            <h1 class="game-title">LABYRINTH OF SHADOWS</h1>
            <p class="subtitle">You have 3 chances to use the flashlight.<br>You have 3 lives.</p>
            <button class="start-button">Start Exploration</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <!-- Top UI -->
        <div class="game-ui">
            <div class="lives">
                <span class="heart">♥</span>
                <span class="heart">♥</span>
                <span class="heart">♥</span>
            </div>
            <div class="flashlights">
                <span class="flashlight">🔦</span>
                <span class="flashlight">🔦</span>
                <span class="flashlight">🔦</span>
            </div>
            <div class="timer">00:10</div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Message Overlay -->
        <div id="messageOverlay" class="message-overlay hidden">
            <div class="message-content">
                <p id="messageText"></p>
            </div>
        </div>

        <!-- Goal Icon (house) -->
        <div id="goalIcon" class="goal-icon">🏠</div>
    </div>

    <!-- Failure Screen -->
    <div id="failureScreen" class="screen">
        <div class="ornate-frame">
            <h1 class="game-title">You failed</h1>
            <button class="start-button">Start Over</button>
        </div>
    </div>

    <!-- Success Screen -->
    <div id="successScreen" class="screen">
        <div class="ornate-frame">
            <h1 class="game-title">Victory!</h1>
            <p class="subtitle">You escaped the labyrinth!</p>
            <button class="start-button">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
